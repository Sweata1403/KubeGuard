apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo
  namespace: kubeguard-demo
  annotations:
    kubeguard.example/enabled: "true"
    kubeguard.example/approved-image: kubeguard-demo:v1
spec:
  replicas: 3
  selector:
    matchLabels: {app: demo}
  template:
    metadata:
      labels: {app: demo}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: demo
          image: kubeguard-demo:v1
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 8080}]
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 250m, memory: 128Mi}
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          startupProbe:
            httpGet: {path: /live, port: 8080}
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet: {path: /ready, port: 8080}
            periodSeconds: 3
          livenessProbe:
            httpGet: {path: /live, port: 8080}
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: demo
  namespace: kubeguard-demo
spec:
  selector: {app: demo}
  ports: [{port: 8080, targetPort: 8080}]
