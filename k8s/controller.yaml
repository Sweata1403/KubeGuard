apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: journal
  namespace: kubeguard-demo
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: {storage: 100Mi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubeguard
  namespace: kubeguard-demo
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: kubeguard}
  template:
    metadata:
      labels: {app: kubeguard}
    spec:
      serviceAccountName: kubeguard
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: controller
          image: kubeguard-controller:v1
          imagePullPolicy: IfNotPresent
          env:
            - {name: EXECUTE, value: "false"}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 250m, memory: 128Mi}
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          volumeMounts: [{name: journal, mountPath: /data}]
      volumes:
        - name: journal
          persistentVolumeClaim: {claimName: journal}
